<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎄 2026 내일교회 성탄 선물 추첨 - 참여 등록</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.05rem;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      border: none;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      transition: 0.15s ease;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      box-shadow: none;
      color: var(--text);
      margin-top: 12px;
    }

    .alert {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
    }

    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .success-box {
      display: none;
      text-align: center;
      padding: 10px 4px;
    }

    .success-box.open { display: block; }

    .success-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .success-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #6ee7b7;
      margin-bottom: 8px;
    }

    .success-info {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin: 14px 0 18px;
      font-size: 0.98rem;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🎄 2026 내일교회<br/>성탄 선물 추첨 등록</h1>
      <p>이름과 전화번호를 입력해 주세요.</p>
    </div>

    <form id="reg-form" onsubmit="handleRegister(event)">
      <div class="field">
        <label for="reg-name">이름</label>
        <input id="reg-name" type="text" placeholder="예: 홍길동" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="reg-phone">전화번호</label>
        <input id="reg-phone" type="tel" placeholder="010-1234-5678" autocomplete="tel" oninput="formatPhoneInput(this)" required />
      </div>
      <button id="submit-btn" type="submit" class="btn">🎁 추첨 참여 등록하기</button>
      <div id="error-box" class="alert"></div>
    </form>

    <div id="success-box" class="success-box">
      <div class="success-icon">🎉</div>
      <div class="success-title">참여 등록이 완료되었습니다!</div>
      <p style="font-size:0.9rem; color:var(--text-muted);">당첨 시 입력하신 번호로 문자(SMS)가 발송됩니다.</p>
      <div class="success-info" id="success-info"></div>
      <button class="btn btn-ghost" onclick="resetForm()">다른 분 추가 등록하기</button>
    </div>
  </div>

  <script>
    const DEFAULT_GAS_URL = '';
    const STORAGE_KEY_URL = 'raffle_gas_webapp_url';

    (function initApiFromQuery() {
      try {
        const params = new URLSearchParams(window.location.search);
        const apiParam = (params.get('api') || '').trim();
        if (apiParam) {
          localStorage.setItem(STORAGE_KEY_URL, apiParam);
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        }
      } catch (e) {}
    })();

    function getGasUrl() {
      return localStorage.getItem(STORAGE_KEY_URL) || DEFAULT_GAS_URL;
    }

    function formatPhoneInput(input) {
      const d = input.value.replace(/\D/g, '').slice(0, 11);
      if (d.length <= 3) input.value = d;
      else if (d.length <= 7) input.value = `${d.slice(0, 3)}-${d.slice(3)}`;
      else input.value = `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const nameEl = document.getElementById('reg-name');
      const phoneEl = document.getElementById('reg-phone');
      const btn = document.getElementById('submit-btn');
      const errBox = document.getElementById('error-box');

      const name = nameEl.value.trim();
      const phone = phoneEl.value.trim();

      errBox.className = 'alert';
      errBox.textContent = '';

      if (!name || !phone) {
        errBox.className = 'alert error';
        errBox.textContent = '이름과 전화번호를 모두 입력해주세요.';
        return;
      }

      btn.disabled = true;
      btn.textContent = '등록 중...';

      try {
        const res = await fetch(getGasUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addParticipant', name, phone })
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error('서버 응답을 확인할 수 없습니다. 잠시 후 다시 시도해주세요.');
        }

        if (!data.ok) {
          throw new Error(data.error || '등록에 실패했습니다.');
        }

        document.getElementById('reg-form').style.display = 'none';
        document.getElementById('success-info').innerHTML = `<strong>${escapeHtml(name)}</strong><br/>${escapeHtml(phone)}`;
        document.getElementById('success-box').classList.add('open');
      } catch (err) {
        errBox.className = 'alert error';
        errBox.textContent = '❌ ' + (err.message || '등록 중 오류가 발생했습니다.');
      } finally {
        btn.disabled = false;
        btn.textContent = '🎁 추첨 참여 등록하기';
      }
    }

    function resetForm() {
      document.getElementById('reg-name').value = '';
      document.getElementById('reg-phone').value = '';
      document.getElementById('error-box').className = 'alert';
      document.getElementById('success-box').classList.remove('open');
      document.getElementById('reg-form').style.display = 'block';
      document.getElementById('reg-name').focus();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }
  </script>
</body>
</html>
