<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎄 2026 내일교회 성탄 선물 추첨 - QR코드 안내지</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar {
      width: 100%;
      max-width: 680px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .url-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: #334155;
      text-decoration: none;
      transition: 0.15s;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #ec4899); }
    .btn-ghost { background: transparent; border-color: var(--border); }

    /* A4 인쇄/PDF용 포스터 영역 */
    .poster-wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
    }

    .poster {
      width: 100%;
      background: #ffffff;
      color: #0f172a;
      border-radius: 22px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      border: 6px solid #e2e8f0;
    }

    .poster-badge {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .poster h1 {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #1e1b4b;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .poster-sub {
      font-size: 1.12rem;
      color: #475569;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .qr-frame {
      display: inline-flex;
      padding: 22px;
      background: #ffffff;
      border: 3px solid #4f46e5;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.14);
      margin-bottom: 24px;
    }

    #qrcode img, #qrcode canvas {
      display: block;
    }

    .poster-guide {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 20px;
      margin: 0 auto 18px;
      max-width: 460px;
      font-size: 1rem;
      color: #334155;
      line-height: 1.6;
    }

    .poster-guide strong {
      color: #dc2626;
    }

    .poster-url {
      font-size: 0.85rem;
      color: #64748b;
      word-break: break-all;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .toolbar { display: none !important; }
      .poster-wrap { max-width: none; }
      .poster {
        box-shadow: none;
        border: 4px solid #cbd5e1;
        border-radius: 16px;
        padding: 40px 28px;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-top">
      <div style="font-weight:800; font-size:1.05rem;">📱 참여자 등록 QR코드 안내지</div>
      <div class="toolbar-actions">
        <a class="btn btn-ghost" href="register.html" target="_blank">📝 등록 페이지 열기</a>
        <button id="pdf-btn" class="btn btn-primary" onclick="downloadPdf()">⬇️ PDF 다운로드</button>
        <button class="btn" onclick="window.print()">🖨️ 인쇄</button>
      </div>
    </div>
    <div class="url-row">
      <input id="qr-url-input" type="url" placeholder="등록 페이지 URL" />
      <button class="btn" onclick="updateQr()">QR 갱신</button>
    </div>
  </div>

  <div class="poster-wrap">
    <div id="poster-area" class="poster">
      <div class="poster-badge">🎄 2026 내일교회 성탄 행사</div>
      <h1>성탄 선물 추첨<br/>참여 등록 안내</h1>
      <p class="poster-sub">
        스마트폰 카메라로 아래 QR코드를 스캔한 뒤<br/>
        <strong>이름</strong>과 <strong>전화번호</strong>를 입력해 주세요!
      </p>

      <div class="qr-frame">
        <div id="qrcode"></div>
      </div>

      <div class="poster-guide">
        🎁 당첨되신 분께는 입력하신 번호로 <strong>문자(SMS)</strong>를 보내드립니다.<br/>
        당첨 확인 문자를 가지고 선물수령처에 오셔서 수령하세요!
      </div>

      <div class="poster-url" id="poster-url-text"></div>
    </div>
  </div>

  <script>
    const DEFAULT_REGISTER_URL = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}register.html`;

    function renderQr(url) {
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      new QRCode(container, {
        text: url,
        width: 280,
        height: 280,
        colorDark: '#1e1b4b',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      document.getElementById('poster-url-text').textContent = url;
    }

    function updateQr() {
      const url = document.getElementById('qr-url-input').value.trim() || DEFAULT_REGISTER_URL;
      renderQr(url);
    }

    async function downloadPdf() {
      const btn = document.getElementById('pdf-btn');
      const element = document.getElementById('poster-area');
      if (typeof html2pdf === 'undefined') {
        alert('PDF 변환 라이브러리를 불러오지 못했습니다. [인쇄] 버튼에서 "PDF로 저장"을 이용해 주세요.');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'PDF 생성 중...';
      try {
        const opt = {
          margin: 12,
          filename: '2026_내일교회_성탄선물추첨_QR코드.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        await html2pdf().set(opt).from(element).save();
      } catch (err) {
        alert('PDF 저장 중 오류가 발생했습니다: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '⬇️ PDF 다운로드';
      }
    }

    document.getElementById('qr-url-input').value = DEFAULT_REGISTER_URL;
    renderQr(DEFAULT_REGISTER_URL);
  </script>
</body>
</html>
